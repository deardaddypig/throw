<meta charset="utf-8">

<title>Office 大戰</title>
<style>
:root{--bg:#eef1f5;--fg:#1d2330;--card:#fff;--ac:#2f6fed;--mut:#5b6475;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--fg:#e8ebf2;--card:#232833;--ac:#5b8def;--mut:#a3adc0}}
:root[data-theme="dark"]{--bg:#14171d;--fg:#e8ebf2;--card:#232833;--ac:#5b8def;--mut:#a3adc0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"PingFang HK","Microsoft JhengHei","Noto Sans TC",sans-serif;display:flex;flex-direction:column;align-items:center}
#wrap{position:relative;width:100%;max-width:900px}
canvas{width:100%;display:block;touch-action:none;background:#ccd5e0}
.ctl{display:flex;gap:10px;padding:10px;width:100%;max-width:900px;box-sizing:border-box}
button{font:inherit;font-size:18px;padding:14px 18px;border-radius:12px;border:0;background:var(--ac);color:#fff;cursor:pointer;user-select:none;touch-action:manipulation}
button.sec{background:var(--mut)}
#go{flex:1}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
.card{background:var(--card);color:var(--fg);padding:22px;border-radius:16px;width:min(86%,380px);text-align:center;display:flex;flex-direction:column;gap:12px}
.card h1{margin:0;font-size:26px}.card p{margin:0;color:var(--mut);font-size:14px;line-height:1.5}
input{font:inherit;font-size:18px;padding:12px;border-radius:10px;border:2px solid var(--mut);background:var(--bg);color:var(--fg);text-align:center}
.hide{display:none!important}
#info,#mid,#tip{display:none}
.ib{flex:1;font-weight:700;font-size:15px}.ib i{display:block;height:10px;margin-top:3px;background:#3a4252;border-radius:5px;overflow:hidden}.ib u{display:block;height:100%;width:100%;background:#2ecc71;transition:width .3s}
@media (orientation:portrait){
#info{display:flex;gap:12px;width:100%;box-sizing:border-box;padding:8px 12px 4px}
#mid,#tip{display:block;text-align:center;font-size:15px;padding:4px 12px}#tip{color:var(--mut)}
.ctl{flex-wrap:wrap}#up,#dn{flex:1;min-height:64px;font-size:28px}#go{flex-basis:100%;order:3;min-height:72px;font-size:22px}
canvas{border-radius:0}}
</style>
</head>

<div id="info"><div class="ib"><b id="n0"></b><i><u id="h0"></u></i></div><div class="ib" style="text-align:right"><b id="n1"></b><i><u id="h1"></u></i></div></div>

<p id="sub">輸入你嘅名字，同 Shing 鬥投擲！<br>按住空白鍵（或畫面下面個掣）儲力，放開就投出。風向同風力每回合都會變，越近紅心傷害越高。</p>
<input id="nm" maxlength="8" placeholder="你嘅名字" autocomplete="off">
<button id="st">開始遊戲</button>
<button id="rn" class="sec hide">改名</button>
</div></div>
</div>
<div id="tip"></div>
<div class="ctl">


<button id="go">…</button>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=1000,H=450;
C.width=W;C.height=H;
const G=520,STEP=1/120,TY=255,HR=48,ANG=35;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const R=(x,y,w,h,c)=>{X.fillStyle=c;X.fillRect(x,y,w,h)};
const O=(x,y,r,c)=>{X.fillStyle=c;X.beginPath();X.arc(x,y,r,0,7);X.fill()};
const F=(s)=>'bold '+s+'px system-ui,"PingFang HK","Microsoft JhengHei","Noto Sans TC",sans-serif';
const T=(t,x,y,s,c,al)=>{X.font=F(s);X.fillStyle=c;X.textAlign=al||'center';X.fillText(t,x,y)};

const items=[
{n:'釘書機',l:.5,d:()=>{R(-16,-4,32,10,'#c0392b');R(-16,-10,30,7,'#8a8f98')}},
{n:'紙團',l:1.7,d:()=>{O(0,0,11,'#f4f4f4');X.strokeStyle='#aaa';X.lineWidth=1.5;X.beginPath();X.moveTo(-6,-3);X.lineTo(3,4);X.moveTo(-2,-8);X.lineTo(6,0);X.stroke()}},
{n:'原子筆',l:1,d:()=>{R(-18,-2,32,4,'#2563eb');R(14,-2,5,4,'#111');R(-18,-2,6,4,'#fff')}},
{n:'文件夾',l:1.2,d:()=>{R(-16,-12,32,24,'#f1c40f');R(-16,-15,12,4,'#f1c40f');R(-10,-4,20,2,'#b8860b')}},
{n:'咖啡杯',l:.7,d:()=>{R(-9,-10,18,20,'#fff');R(-9,-10,18,4,'#6f4e37');X.strokeStyle='#fff';X.lineWidth=3;X.beginPath();X.arc(11,0,5,-1.5,1.5);X.stroke()}},
{n:'計算機',l:.6,d:()=>{R(-11,-15,22,30,'#2d3436');R(-8,-12,16,6,'#9be3a0');for(let i=0;i<3;i++)for(let j=0;j<3;j++)R(-8+i*6,-3+j*6,4,4,'#b2bec3')}},
{n:'便利貼',l:1.9,d:()=>{R(-12,-12,24,24,'#ffe66d');R(-8,-6,16,2,'#d4b800');R(-8,0,12,2,'#d4b800')}},
{n:'膠紙',l:.9,d:()=>{O(0,0,12,'#e8c547');O(0,0,6,'#8d99a8')}},
{n:'滑鼠',l:.8,d:()=>{X.fillStyle='#dfe4ea';X.beginPath();X.ellipse(0,0,10,15,0,0,7);X.fill();R(-1,-15,2,10,'#8d99a8')}}
];

const IS={'釘書機':[.5,1.3,46,'重手，傷害高'],'紙團':[2.2,.8,50,'最易受風吹'],'原子筆':[.3,.7,52,'極準，受風細，傷害低'],'文件夾':[1.2,.9,60,'面積大，易中'],'咖啡杯':[.7,.9,64,'濺開，範圍大'],'計算機':[.6,1.2,46,'硬淨，傷害高'],'便利貼':[1.9,.6,50,'超輕，風大會飄'],'膠紙':[.9,1,50,'普通'],'滑鼠':[.8,1,50,'普通']};
items.forEach(it=>{[it.l,it.k,it.r,it.t]=IS[it.n]});
const $=id=>document.getElementById(id),PT=matchMedia('(orientation:portrait)'),pick=a=>a[Math.floor(Math.random()*a.length)];
let AC;function au(){if(!AC)try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f1,f2,d,ty,v,t0){if(!AC)return;const t=AC.currentTime+(t0||0),o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(f2,20),t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
function noise(d,f1,f2,v){if(!AC)return;const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter(),t=AC.currentTime,g=AC.createGain();fl.type='bandpass';fl.frequency.setValueAtTime(f1,t);fl.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.3,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start()}
const SFX={throw:()=>noise(.3,400,2500,.35),hit:()=>{tone(180,50,.25,'square',.25);noise(.12,1500,300,.3)},crit:()=>{SFX.hit();[784,1047,1568].forEach((f,i)=>tone(f,f,.25,'triangle',.2,.08+i*.08))},miss:()=>tone(120,60,.2,'sine',.2),boss:()=>[330,277,233,196].forEach((f,i)=>tone(f,f*.95,.3,'sawtooth',.15,i*.22)),win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,f,.3,'triangle',.22,i*.14)),lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,f*.97,.35,'triangle',.22,i*.2))};
const snd=n=>{try{SFX[n]()}catch(e){}};
function say(t,x,y){S.say={t,x:x===650?P[1].x:x,y:y||166,l:2.2}}
function drawSay(){const s=S.say;if(!s||s.l<=0)return;X.font=F(15);const w=X.measureText(s.t).width+24,x=cl(s.x-w/2,6,W-w-6),y=s.y;RR(x,y,w,30,12,'#fff');X.strokeStyle='#333';X.lineWidth=2;X.beginPath();X.roundRect(x,y,w,30,12);X.stroke();X.fillStyle='#fff';X.beginPath();X.moveTo(s.x-8,y+29);X.lineTo(s.x,y+42);X.lineTo(s.x+8,y+29);X.fill();T(s.t,x+w/2,y+20,15,'#222')}
function fx(crit,tg){S.shake=crit?26:12;if(crit)S.slow=1.1;if(S.it.n==='咖啡杯')S.msg+=' 濺開！';snd(crit?'crit':'hit');
 if(tg===P[1])say(pick(['好痛呀！','我要投訴！','算你贏呢球…','你係咪練過？']),650);else say(pick(['收工！','Easy 啦～','你頂唔順喇？']),650)}
function bossHit(){const th=P[S.turn];th.hp=Math.max(0,th.hp-20);th.sh=.5;snd('boss');burst(S.boss.x,250);S.shake=14;S.msg='打中老闆！罰 -20';say('扣你薪水！',S.boss.x,80);S.phase='msg';S.mt=1.8;S.f=null}
function boss(){const b=S.boss;if(!b)return;const x=b.x,sw=Math.sin(performance.now()/166)*5;X.save();X.translate(x,332);X.scale(1.6,1.6);X.translate(-x,-332);
 R(x-12,296,10,34,'#222a40');R(x+2,296,10,34,'#222a40');R(x-14,328,14,5,'#111');R(x,328,14,5,'#111');
 RR(x-21,226,42,76,10,'#1f2a44');X.fillStyle='#fff';X.beginPath();X.moveTo(x-8,226);X.lineTo(x,246);X.lineTo(x+8,226);X.fill();
 X.fillStyle='#c0392b';X.beginPath();X.moveTo(x-3,236);X.lineTo(x+3,236);X.lineTo(x+4,272);X.lineTo(x,278);X.lineTo(x-4,272);X.fill();
 X.strokeStyle='#1f2a44';X.lineWidth=9;X.lineCap='round';X.beginPath();X.moveTo(x-20,236);X.lineTo(x-26,262+sw);X.moveTo(x+20,236);X.lineTo(x+26,262-sw);X.stroke();
 O(x,212,16,'#f0c8a0');X.fillStyle='#aaa';X.beginPath();X.arc(x,208,16.5,Math.PI,0);X.fill();
 X.strokeStyle='#222';X.lineWidth=2;X.beginPath();X.moveTo(x-9,208);X.lineTo(x-3,211);X.moveTo(x+9,208);X.lineTo(x+3,211);X.stroke();O(x-6,213,1.8,'#222');O(x+6,213,1.8,'#222');R(x-6,220,12,2,'#555');
 RR(x-15,244,30,13,2,'#fff');T('老闆',x,254,9,'#c0392b');X.restore();T('⚠ 老闆巡緊，打中會被罰！',400,128,14,'#b3261e')}
function info(){if(!PT.matches)return;[0,1].forEach(i=>{$('n'+i).textContent=P[i].name+'  '+P[i].hp;$('h'+i).style.width=P[i].hp+'%'});
 const ar=['→','↘','↓','↙','←','↖','↑','↗'][Math.round(S.w.ang/(Math.PI/4))%8];
 $('mid').textContent=(S.w.lv?'風 '+ar+' '+S.w.lv:'無風')+' · '+S.it.n+'（'+S.it.t+'）'+(S.boss?' · ⚠ 老闆':'');
 $('tip').textContent=S.turn===1&&S.phase!=='over'?'Shing 嘅回合…':S.phase==='aim'?'按住「儲力」掣，放開就投出':S.phase==='power'?'睇住力度條，揀好時機放手！':''}
const P=[
{x:25,dir:1,col:'#3b82f6',hair:'#3a2a1a',hp:100,sh:0,ang:45,name:'我'},
{x:775,dir:-1,col:'#5a6478',hair:'#111',hp:100,sh:0,ang:45,name:'Shing'}
];
let S={phase:'name',turn:0,pw:0,pt:0,msg:'',mt:0,f:null,w:{lv:0,ang:0},it:items[0],ai:null,acc:0};
const keys={up:0,dn:0};
const hand=(i,a)=>{const r=a*Math.PI/180;return [P[i].x+P[i].dir*Math.cos(r)*30,265-Math.sin(r)*30]};
const wind=()=>({ax:Math.cos(S.w.ang)*S.w.lv*48,ay:Math.sin(S.w.ang)*S.w.lv*22});
function mk(i,a,pw){const [x,y]=hand(i,a),r=a*Math.PI/180,v=250+pw*600;return{x,y,vx:P[i].dir*Math.cos(r)*v,vy:-Math.sin(r)*v,rot:0,min:1e9,in:false}}
function stepF(f,w,it,h){f.vx+=w.ax*it.l*h;f.vy+=(G+w.ay*it.l)*h;f.x+=f.vx*h;f.y+=f.vy*h;f.rot+=8*h}
function sim(i,a,pw,w,it){const f=mk(i,a,pw),tx=P[1-i].x;let m=1e9;for(let k=0;k<700;k++){stepF(f,w,it,STEP);const d=Math.hypot(f.x-tx,f.y-TY);if(d<m)m=d;if(S.boss&&Math.abs(f.x-S.boss.x)<62&&f.y>116&&f.y<335)return 1e9;if(f.y>430||f.x<-40||f.x>840)break}return m}
function aiPick(){const w=wind();let b=null,bd=1e9;
 for(let a=ANG;a<=ANG;a++)for(let p=.2;p<=1.001;p+=.01){const d=sim(1,a,p,w,S.it);if(d<bd){bd=d;b={a,p}}}
 b.a=ANG;b.p=cl(b.p+(Math.random()*2-1)*.04,.15,1);b.d=.9;return b}

function startTurn(){
 S.w={lv:Math.random()<.15?0:1+Math.floor(Math.random()*5),ang:Math.random()*Math.PI*2};
 S.it=items[Math.floor(Math.random()*items.length)];
 S.boss=Math.random()<.35?{x:300+Math.random()*200,dir:Math.random()<.5?1:-1}:null;S.f=null;S.phase='aim';S.pw=0;
 if(S.turn===1)S.ai=aiPick();
}
function newGame(){P[0].hp=P[1].hp=100;P[0].ang=P[1].ang=ANG;S.turn=0;S.msg='';startTurn()}
function act(){
 if(S.turn!==0)return;
 if(S.phase==='aim'){S.phase='power';S.pt=0;S.pw=0}
 else if(S.phase==='power')throwIt();
}
function charge(){if(S.turn===0&&S.phase==='aim'){S.phase='power';S.pt=0;S.pw=0;S.held=1}}
function release(){if(S.turn===0&&S.phase==='power'&&S.held){S.held=0;throwIt()}}
function throwIt(){snd('throw');S.f=mk(S.turn,P[S.turn].ang,S.pw);S.phase='fly';S.acc=0}
function hit(m){const tg=P[1-S.turn],acc=1-m/S.it.r,dmg=Math.round((5+35*acc)*S.it.k);
 tg.hp=Math.max(0,tg.hp-dmg);tg.sh=.5;burst(tg.x,TY);
 S.msg=(m<12?'正中紅心！':acc>.6?'好準！':acc>.3?'命中！':'擦到少少')+' -'+dmg;
 S.phase='msg';S.mt=m<12?2.4:1.6;S.f=null;fx(m<12,tg)}
function miss(t){snd('miss');say(S.turn===0?pick(['你係咪冇食早餐？','打邊度呀？','差遠喇！']):pick(['風太大喇…','咦，今次唔計','我預熱緊啫']),650);S.msg=t||'打偏咗！';S.phase='msg';S.mt=1.2;S.f=null}
function nextT(){
 if(P[0].hp<=0||P[1].hp<=0){over();return}
 S.turn=1-S.turn;startTurn();
}
function over(){S.phase='over';snd(P[1].hp<=0?'win':'lose');
 const win=P[1].hp<=0;
 document.getElementById('ttl').textContent=win?'🎉 '+P[0].name+' 贏咗！':'😎 Shing 贏咗！';
 document.getElementById('sub').textContent=win?'成功用文具擊倒 Shing！':'下次再接再厲！';
 nm.classList.add('hide');st.textContent='再玩一次';rn.classList.remove('hide');ov.classList.remove('hide')}

/* particles for AC wind */
const pts=Array.from({length:45},()=>({x:Math.random()*W,y:Math.random()*H}));

function upd(dt){
 P.forEach(p=>{if(p.sh>0)p.sh-=dt});if(S.say)S.say.l-=dt;if(S.boss){S.boss.x+=S.boss.dir*45*dt;if(S.boss.x>505)S.boss.dir=-1;if(S.boss.x<295)S.boss.dir=1}
 const w=wind();
 pts.forEach(p=>{p.x+=w.ax*.9*dt;p.y+=(w.ay*.9+12)*dt;if(p.x<0)p.x+=W;if(p.x>W)p.x-=W;if(p.y>H)p.y=0;if(p.y<0)p.y=H});
 if(S.phase==='aim'){
  if(S.turn===0)P[0].ang=cl(P[0].ang+(keys.up-keys.dn)*50*dt,10,80);
  else if(S.ai.d>0)S.ai.d-=dt;
  else{const dd=S.ai.a-P[1].ang;if(Math.abs(dd)<.5){S.phase='power';S.pw=0}else P[1].ang+=Math.sign(dd)*Math.min(Math.abs(dd),45*dt)}
 }else if(S.phase==='power'){
  if(S.turn===0){S.pt+=dt;S.pw=1-Math.abs((S.pt*.9)%2-1)}
  else{S.pw+=dt*1.1;if(S.pw>=S.ai.p){S.pw=S.ai.p;throwIt()}}
 }else if(S.phase==='fly'){
  S.acc+=Math.min(dt,.05);
  while(S.acc>=STEP&&S.phase==='fly'){
   S.acc-=STEP;const f=S.f,tg=P[1-S.turn];
   stepF(f,w,S.it,STEP);
   const d=Math.hypot(f.x-tg.x,f.y-TY);
   if(d<S.it.r){f.in=true;if(d<f.min)f.min=d}
   if(S.boss&&Math.abs(f.x-S.boss.x)<34&&f.y>116&&f.y<335){bossHit();break}
   if(f.in&&d>f.min+.5){hit(f.min);break}
   if(f.y>312&&(Math.abs(f.x-P[0].x)<90||Math.abs(f.x-P[1].x)<90)){miss('跌咗落枱面');break}
   if(f.y>395||f.x<-40||f.x>840){miss();break}
  }
 }else if(S.phase==='msg'){S.mt-=dt;if(S.mt<=0)nextT()}
}

/* drawing */
const RR=(x,y,w,h,r,c)=>{X.fillStyle=c;X.beginPath();X.roundRect(x,y,w,h,r);X.fill()};
let bursts=[];
function burst(x,y){const cs=['#fff','#ffe66d','#8ec5ff','#ff9f9f'];for(let i=0;i<28;i++){const a=Math.random()*6.28,v=80+Math.random()*220;bursts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,l:1,c:cs[i%4],r:Math.random()*6,s:3+Math.random()*4})}}
function drawBursts(){const dt=1/60;bursts=bursts.filter(b=>b.l>0);bursts.forEach(b=>{b.vy+=400*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.r+=dt*8;b.l-=dt*.9;X.save();X.globalAlpha=Math.max(0,b.l);X.translate(b.x,b.y);X.rotate(b.r);R(-b.s,-b.s*.7,b.s*2,b.s*1.4,b.c);X.restore()})}
function vig(){const g=X.createRadialGradient(500,225,300,500,225,680);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.33)');X.fillStyle=g;X.fillRect(0,0,W,H)}
function bg(){const tm=performance.now()/1000;
